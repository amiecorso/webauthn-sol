
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FCL verify gas distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>body{font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin:20px}</style>
</head>
<body>
  <h3>FCL verify gas distribution</h3>
  <p><button id="save">Download PNG</button></p>
  <canvas id="chart" width="1000" height="500"></canvas>
  <script>
    const labels = ["178134-178446", "178446-178759", "178759-179071", "179071-179384", "179384-179697", "179697-180009", "180009-180322", "180322-180635", "180635-180947", "180947-181260", "181260-181572", "181572-181885", "181885-182198", "182198-182510", "182510-182823", "182823-183136", "183136-183448", "183448-183761", "183761-184074", "184074-184386", "184386-184699", "184699-185011", "185011-185324", "185324-185637", "185637-185949", "185949-186262", "186262-186575", "186575-186887", "186887-187200", "187200-187513"];
    const data = [5, 1, 3, 4, 5, 11, 8, 13, 10, 14, 16, 13, 17, 17, 20, 21, 17, 12, 23, 8, 14, 2, 8, 6, 2, 7, 6, 0, 0, 1];
    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Count', data, backgroundColor: 'rgba(54, 162, 235, 0.5)' }] },
      options: {
        responsive: false,
        scales: {
          x: { title: { display: true, text: 'Gas range' }, ticks: { maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 20 } },
          y: { title: { display: true, text: 'Count' }, beginAtZero: true }
        }
      }
    });
    document.getElementById('save').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = chart.toBase64Image('image/png', 1.0);
      a.download = 'fcl_gas_hist.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
